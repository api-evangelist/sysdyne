  description: >-
    SOAP web service for the ConcreteGO cloud dispatch platform. Uses an RSA
    public-key credential exchange (GetPublicKey) and a session login
    (Login/Login2) with a Sysdyne-issued AppID/AppKey, then submits work through a
    generic ProcessRequest operation. WSDL published at
